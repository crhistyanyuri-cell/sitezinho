<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto</title>
</head>
<body>
    <header class="cabeçalho-projeto">
        <a href="SeusProjetos.html" class="voltar">
            ← Voltar
        </a>
        <h1 id="tituloProjeto">Projeto</h1>

        <button id="adicionarImagem">

            + Adicionar imagem

        </button>


        <input



            type="file"

            id="seletorImagem"

            accept="image/*"

            hidden
        >
    </header>


    <main



        class="imagens-projeto"

        id="imagensProjeto">

    </main>
        
     <div



        id="janelaImagem"



        class="janela-imagem">



        <span



            id="fecharImagem"


            class="fechar-imagem">


            ×

        </span>


        <img id="imagemAmpliada">

    </div>

    <div id="janelaProjetos" class="janela-projetos">



        <div class="caixa-projetos">

            <button id="fecharProjetos" class="fechar-projetos">×</button>

            <h2 id="tituloJanelaProjetos">Escolha um projeto</h2>


            <div id="listaProjetos" class="lista-projetos"></div>


        </div>
        
</body>
</html>
