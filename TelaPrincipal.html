    <!-- JANELA MODAL (Para clicar nas fotos e vê-las maiores) -->
    <div id="janela-modal" class="modal">
        <span class="botao-fechar">&times;</span>
        <img class="conteudo-modal" id="imagem-expandida">
    </div>

    <!-- CODE SCRIPT JAVASCRIPT DO CLIQUE E ZOOM -->
    <script>
        const modal = document.getElementById("janela-modal");
        const imgModal = document.getElementById("imagem-expandida");
        const btnFechar = document.querySelector(".botao-fechar");

        // Ativa o zoom ao clicar em qualquer imagem do Pinterest
        document.querySelectorAll(".pin img").forEach(imagem => {
            imagem.addEventListener("click", function() {
                modal.style.display = "flex"; // Abre usando flex para centralizar
                imgModal.src = this.src;
            });
        });

        // Fecha no botão X
        btnFechar.onclick = function() {
            modal.style.display = "none";
        }

        // Fecha ao clicar fora da foto (no fundo escuro)
        modal.onclick = function(evento) {
            if (evento.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>
